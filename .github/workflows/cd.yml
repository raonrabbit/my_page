name: CD (Deployment)
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: ./my-page
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          sha: ${{ github.event.workflow_run.head_sha }}
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build
        run: pnpm run build
      
      - name: Deploy to Vercel
        id: vercel-deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./my-page
      
      - name: Read Current Edge Config
        run: |
          curl 'https://edge-config.vercel.com/${{ secrets.VERCEL_EDGE_CONFIG_ID }}/item/blue-green-configuration?token=${{ secrets.EDGE_CONFIG_TOKEN }}' \
            -o current-config.json
          cat current-config.json
      
      - name: Prepare Blue-Green URLs
        id: prepare-urls
        run: |
          BLUE_DOMAIN=$(cat current-config.json | jq -r '.deploymentDomainBlue')
          
          if [ -z "$BLUE_DOMAIN" ] || [ "$BLUE_DOMAIN" = "null" ]; then
            BLUE_DOMAIN="my-page-9xnklttos-raonrabbit-3960s-projects.vercel.app"
          fi
          
          GREEN_URL="${{ steps.vercel-deploy.outputs.preview-url }}"
          GREEN_DOMAIN=$(echo $GREEN_URL | sed 's|https://||' | sed 's|http://||' | sed 's|/$||')
          
          echo "blue=${BLUE_DOMAIN}" >> $GITHUB_OUTPUT
          echo "green=${GREEN_DOMAIN}" >> $GITHUB_OUTPUT
          echo "Blue: $BLUE_DOMAIN"
          echo "Green: $GREEN_DOMAIN"
      
      - name: Update Edge Config for Blue-Green
        if: success()
        run: |
          curl -X 'PATCH' 'https://api.vercel.com/v1/edge-config/${{ secrets.VERCEL_EDGE_CONFIG_ID }}/items?teamId=${{ secrets.VERCEL_ORG_ID }}' \
            -H 'Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}' \
            -H 'Content-Type: application/json' \
            -d "{
              \"items\": [
                {
                  \"operation\": \"upsert\",
                  \"key\": \"blue-green-configuration\",
                  \"value\": {
                    \"deploymentDomainBlue\": \"${{ steps.prepare-urls.outputs.blue }}\",
                    \"deploymentDomainGreen\": \"${{ steps.prepare-urls.outputs.green }}\",
                    \"trafficGreenPercent\": 50
                  }
                }
              ]
            }"
