name: Promote to Production

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_PROD_URL: ${{ secrets.VERCEL_PRODUCTION_DOMAIN }}

on:
  workflow_dispatch:  # 수동 실행

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel
        
      - name: Read Current Edge Config
        run: |
          curl 'https://edge-config.vercel.com/${{ secrets.VERCEL_EDGE_CONFIG_ID }}/item/blue-green-configuration?token=${{ secrets.EDGE_CONFIG_TOKEN }}' \
                -o config.json
          cat config.json
                
      - name: Extract Green Deployment URL
        id: green-url
        run: |
          GREEN_URL=$(cat config.json | jq -r '.deploymentDomainGreen')
          echo "url=${GREEN_URL}" >> $GITHUB_OUTPUT
          echo "Green deployment URL: ${GREEN_URL}"

      - name: Promote Green to Production
        run: |
          vercel promote ${{ steps.green-url.outputs.url }} \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope ${{ secrets.VERCEL_ORG_ID }}
        
      - name: Reset Edge Config (Stop Traffic Split)
        run: |
          curl -X 'PATCH' 'https://api.vercel.com/v1/edge-config/${{ secrets.VERCEL_EDGE_CONFIG_ID }}/items?teamId=${{ secrets.VERCEL_ORG_ID }}' \
          -H 'Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}' \
          -H 'Content-Type: application/json' \
          -d '{
            "items": [
              {
                "operation": "upsert",
                "key": "blue-green-configuration",
                "value": {
                  "deploymentDomainBlue": "${{ env.VERCEL_PROD_URL }}",
                  "deploymentDomainGreen": "${{ env.VERCEL_PROD_URL }}",
                  "trafficGreenPercent": 0
                }
              }
            ]
          }'
